[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dayphony"
version = "0.1.0"
description = "A private, adaptive soundtrack for your working day"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  { name = "Carl Axberg" }
]
keywords = ["adaptive-music", "procedural-music", "sonic-pi", "supercollider", "productivity"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/axberg/Dayphony"
Repository = "https://github.com/axberg/Dayphony"
Issues = "https://github.com/axberg/Dayphony/issues"

[project.scripts]
dayphony = "dayphony.__main__:main"

[tool.setuptools.packages.find]
include = ["dayphony*"]
